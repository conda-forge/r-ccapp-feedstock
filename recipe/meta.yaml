{% set version = "0.3.6" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-ccapp
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/ccaPP_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/ccaPP/ccaPP_{{ version }}.tar.gz
  sha256: 2f59eed30c06608a8994af51affcb22d9651143a75aa2da236b640eb93264fc7

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - cross-r-base {{ r_base }}      # [build_platform != target_platform]
    - r-pcapp >=1.8_1                # [build_platform != target_platform]
    - r-rcpp >=0.11.0                # [build_platform != target_platform]
    - r-rcpparmadillo >=0.7.200.1.0  # [build_platform != target_platform]
    - r-robustbase                   # [build_platform != target_platform]
    - {{ compiler('c') }}            # [not win]
    - {{ stdlib("c") }}              # [not win]
    - {{ compiler('m2w64_c') }}      # [win]
    - {{ stdlib("m2w64_c") }}        # [win]
    - {{ compiler('cxx') }}          # [not win]
    - {{ compiler('m2w64_cxx') }}    # [win]
    - {{ posix }}filesystem          # [win]
    - {{ posix }}make
    - {{ posix }}sed                 # [win]
    - {{ posix }}coreutils           # [win]
    - {{ posix }}zip                 # [win]
  host:
    - r-base
    - r-pcapp >=1.8_1
    - r-rcpp >=0.11.0
    - r-rcpparmadillo >=0.7.200.1.0
    - r-robustbase
    - libblas
    - liblapack
  run:
    - r-base
    - r-pcapp >=1.8_1
    - r-rcpp >=0.11.0
    - r-robustbase

test:
  commands:
    - $R -e "library('ccaPP')"           # [not win]
    - "\"%R%\" -e \"library('ccaPP')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=ccaPP
  license: GPL-2.0-or-later
  summary: Canonical correlation analysis and maximum correlation via projection pursuit, as well as fast implementations of correlation estimators, with a focus on robust and nonparametric methods.
  license_family: GPL2
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2'
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
    - MathiasHaudgaard
    - FrodePedersen
    - ArneKr
